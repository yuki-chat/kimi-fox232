<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة لوكا المتقدمة للأكواد</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body { background-color: #0d1117; color: #c9d1d9; padding: 20px; }
    header { text-align: center; margin: 30px 0; }
    h1 { color: #58a6ff; font-size: 2rem; margin-bottom: 8px; }
    p { color: #8b949e; }
    
    .code-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }
    
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 18px;
      transition: transform 0.3s, border-color 0.3s;
    }
    .card:hover { transform: translateY(-5px); border-color: #58a6ff; }
    
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .badge { background: #238636; color: white; padding: 3px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; }
    pre { border-radius: 6px; margin-top: 10px; }
  </style>
</head>
<body>

  <header>
    <h1>منصة لوكا لتطوير الكودات</h1>
    <p>معرض السكربتات والأكواد البرمجية المتحركة</p>
  </header>

  <main class="code-grid" id="codeGrid">
    <p style="text-align: center; grid-column: 1/-1;">جاري تحميل الأكواد...</p>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script>
    // يتعرف الكود تلقائياً على اسم حسابك ومستودعك بدون أي تعديل منك
    async function loadCodes() {
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      const hostParts = window.location.hostname.split('.');
      
      const username = hostParts[0];
      const repo = pathParts[0] || '';

      try {
        const response = await fetch(`https://raw.githubusercontent.com/${username}/${repo}/main/data.json?v=` + Date.now());
        if (!response.ok) throw new Error();
        
        const data = await response.json();
        const grid = document.getElementById("codeGrid");
        grid.innerHTML = "";

        if (data.length === 0) {
          grid.innerHTML = "<p style='text-align:center; grid-column: 1/-1;'>لا توجد أكواد مضافة بعد.</p>";
          return;
        }

        data.forEach(item => {
          grid.innerHTML += `
            <article class="card">
              <div class="card-header">
                <h3>${item.title}</h3>
                <span class="badge">${item.lang}</span>
              </div>
              <pre><code class="language-${item.lang.toLowerCase()}">${escapeHtml(item.code)}</code></pre>
            </article>
          `;
        });
        Prism.highlightAll();
      } catch (e) {
        document.getElementById("codeGrid").innerHTML = "<p style='text-align:center; grid-column: 1/-1;'>تأكد من إضافتك لملف data.json داخل المستودع.</p>";
      }
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    window.onload = loadCodes;
  </script>
</body>
</html>
